<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe6"><link rel="icon" href="icon-512.png" type="image/png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon(3).png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="12 Frames"><title>12 Frames</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4efe6;color:#292824;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:720px;margin:auto;padding:28px 18px 80px}.top{display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#777}h1{font-family:Georgia,serif;font-size:42px;margin:5px 0 4px}.sub{color:#777;margin:0}.date{font-size:13px;color:#777;margin-top:8px}.progress{margin:26px 0 20px}.bar{height:6px;background:#ded7ca;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:#292824;transition:.3s}.count{font-size:12px;margin-top:7px;color:#777}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.card{background:#fffaf2;border:1px solid #ded7ca;border-radius:10px;overflow:hidden;position:relative}.photo{aspect-ratio:1/1;height:auto;display:flex;align-items:center;justify-content:center;background:#e8e1d5;color:#8b857b;font-size:24px;cursor:pointer}.photo img{width:100%;height:100%;object-fit:cover}.meta{padding:7px}.num{font-size:8px;letter-spacing:.08em;color:#999}.mission{font-family:Georgia,serif;font-size:12px;line-height:1.25;margin:2px 0 5px;min-height:30px}.note{width:100%;border:0;border-bottom:1px solid #ddd2c2;background:transparent;padding:3px 0;font-size:10px;outline:none}.done{position:absolute;top:8px;right:8px;background:#fff;border-radius:50%;width:25px;height:25px;display:none;align-items:center;justify-content:center}.card.complete .done{display:flex}.actions{display:flex;gap:10px;margin-top:24px}.btn{flex:1;padding:14px;border-radius:14px;border:1px solid #292824;background:transparent;font-weight:600}.btn.primary{background:#292824;color:white}.hint{text-align:center;color:#888;font-size:12px;margin-top:18px;line-height:1.5}input[type=file]{display:none}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}#sheet{display:block;background:#fffaf2;padding:20px;border-radius:18px;margin-top:22px}.sheetgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.sheetgrid>div{aspect-ratio:1/1}.sheetgrid img{width:100%;height:100%;object-fit:cover}#editor{display:none;margin-top:22px}#editor.show{display:block}.sheetgrid img{width:100%;aspect-ratio:1/1;object-fit:cover}.sheettitle{font-family:Georgia,serif;font-size:28px;margin:0 0 4px}.sheetdate{color:#777;margin:0 0 14px}
</style></head>
<body><main>
<div class="top"><div><div class="eyebrow">An ordinary day, remembered.</div><h1>12 Frames</h1><p class="sub">평범한 하루를 열두 번 바라보기.</p><div class="date" id="date"></div></div></div>
<div class="progress"><div class="bar"><div class="fill" id="fill"></div></div><div class="count" id="count">0 / 12 frames</div></div>
<section id="sheet" class="show"><h2 class="sheettitle">My Day in 12 Frames</h2><p class="sheetdate" id="sheetdate"></p><div class="sheetgrid" id="sheetgrid"></div></section>
<div class="actions"><button class="btn" id="reset">오늘 기록 지우기</button><button class="btn primary" id="finish">사진 입력하기</button></div>
<div id="editor"><div class="grid" id="grid"></div></div>
<p class="hint">사진과 문장은 이 기기의 브라우저에만 저장돼.<br>Safari 데이터를 지우면 기록도 사라질 수 있어.</p>
</main>
<script>
const missions=["오늘의 시작","오늘 먹은 것","이동 중 본 것","내 손","오늘 가장 많이 본 풍경","누군가의 흔적","예상 못 한 것","예뻤던 것","귀찮았던 것","오늘의 나","감사했던 순간","하루의 끝"];
const key="12frames-"+new Date().toISOString().slice(0,10); let data=JSON.parse(localStorage.getItem(key)||"{}");
const fmt=new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date()); document.querySelector("#date").textContent=fmt; document.querySelector("#sheetdate").textContent=fmt;
function save(){localStorage.setItem(key,JSON.stringify(data));render();renderSheet()}
function render(){const g=document.querySelector("#grid");g.innerHTML="";missions.forEach((m,i)=>{let d=data[i]||{};let c=document.createElement("div");c.className="card "+(d.img?"complete":"");c.innerHTML='<div class="done">✓</div><label class="photo">'+(d.img?'<img src="'+d.img+'">':'＋')+'<input type="file" accept="image/*" capture="environment"></label><div class="meta"><div class="num">FRAME '+String(i+1).padStart(2,"0")+'</div><div class="mission">'+m+'</div><input class="note" maxlength="100" placeholder="이 순간을 한 문장으로…" value="'+(d.note||"").replace(/"/g,"&quot;")+'"></div>';let f=c.querySelector("input[type=file]");f.onchange=e=>{let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>compress(r.result,i);r.readAsDataURL(file)};c.querySelector(".note").onchange=e=>{data[i]={...(data[i]||{}),note:e.target.value};save()};g.appendChild(c)});let n=Object.values(data).filter(x=>x.img).length;document.querySelector("#count").textContent=n+" / 12 frames";document.querySelector("#fill").style.width=(n/12*100)+"%"}
function compress(src,i){let im=new Image();im.onload=()=>{let max=900,s=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*s;cv.height=im.height*s;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);data[i]={...(data[i]||{}),img:cv.toDataURL("image/jpeg",.72)};save()};im.src=src}
function renderSheet(){let sg=document.querySelector("#sheetgrid");sg.innerHTML="";missions.forEach((m,i)=>{let d=data[i]||{};let box=document.createElement("div");if(d.img)box.innerHTML='<img src="'+d.img+'" alt="'+m+'">';else {box.style.cssText="background:#e8e1d5;display:grid;place-items:center;color:#999;font-size:11px;text-align:center;padding:6px";box.textContent=m}sg.appendChild(box)})} document.querySelector("#finish").onclick=()=>{let e=document.querySelector("#editor"),b=document.querySelector("#finish");e.classList.toggle("show");b.textContent=e.classList.contains("show")?"완성 화면 보기":"사진 입력하기";if(!e.classList.contains("show"))document.querySelector("#sheet").scrollIntoView({behavior:"smooth"})};
document.querySelector("#reset").onclick=()=>{if(confirm("오늘 찍은 사진과 문장을 모두 지울까?")){localStorage.removeItem(key);data={};document.querySelector("#sheet").classList.remove("show");render()}};
render();renderSheet();
</script></body></html>
