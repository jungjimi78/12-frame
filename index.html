<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe6"><link rel="icon" href="icon-512.png?v=5" type="image/png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon(3).png?v=5">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="12 Frames"><title>12 Frames</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4efe6;color:#292824;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:720px;margin:auto;padding:28px 18px 80px}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#777}h1{font-family:Georgia,serif;font-size:42px;margin:5px 0 4px}.sub,.date{color:#777}.sub{margin:0}.date{font-size:13px;margin-top:8px}.today{margin-top:28px;background:#fffaf2;border:1px solid #ded7ca;border-radius:18px;padding:16px}.prompt{font-family:Georgia,serif;font-size:22px;margin:0 0 12px}.photo{aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#e8e1d5;display:flex;align-items:center;justify-content:center;color:#8b857b;font-size:36px;cursor:pointer}.photo img{width:100%;height:100%;object-fit:cover}.note{width:100%;min-height:100px;resize:vertical;border:0;border-bottom:1px solid #d7cdbd;background:transparent;padding:12px 2px 8px;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;outline:none}.monthHead{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.monthTitle{font-family:Georgia,serif;font-size:27px;margin:0}.nav{border:0;background:transparent;font-size:24px;padding:6px 10px;cursor:pointer}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;color:#8b857b;font-size:10px;padding:4px}.day{aspect-ratio:1/1;background:#e8e1d5;border-radius:7px;overflow:hidden;position:relative}.day.empty{background:transparent}.day img{width:100%;height:100%;object-fit:cover}.day .n{position:absolute;top:4px;left:5px;font-size:9px;background:rgba(255,250,242,.85);padding:1px 3px;border-radius:4px}.day.todayMark{outline:2px solid #292824}.viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:99;padding:18px}.viewer.show{display:flex}.viewerCard{max-width:680px;width:100%;display:flex;flex-direction:column;align-items:center}.viewer img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:10px}.viewerNote{color:white;font-family:Georgia,serif;font-size:18px;line-height:1.55;text-align:center;margin:14px 10px 0;white-space:pre-wrap}.viewerClose{position:absolute;top:18px;right:20px;border:0;background:transparent;color:white;font-size:34px;cursor:pointer}.hint{text-align:center;color:#888;font-size:12px;margin-top:22px;line-height:1.5}input[type=file]{display:none}.remove{margin-top:10px;border:0;background:transparent;color:#8b857b;font-size:12px;text-decoration:underline;cursor:pointer}
</style></head>
<body><main>
<div class="eyebrow">An ordinary day, remembered.</div><h1>12 Frames</h1><p class="sub">평범한 하루에서 기억하고 싶은 한 장.</p><div class="date" id="date"></div>
<section class="today"><h2 class="prompt">오늘을 한 장만 남긴다면?</h2><label class="photo" id="photo">＋<input id="file" type="file" accept="image/*" ></label><textarea class="note" id="note" maxlength="2000" placeholder="오늘의 이야기를 남겨보세요…"></textarea><button class="remove" id="remove">오늘 기록 지우기</button></section>
<div class="monthHead"><button class="nav" id="prev">‹</button><h2 class="monthTitle" id="monthTitle"></h2><button class="nav" id="next">›</button></div>
<div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="calendar" id="calendar"></div>
<p class="hint">하루 한 장이면 충분해.<br>사진을 남기지 않은 날은 빈칸 그대로 두어도 괜찮아.</p>
</main><div class="viewer" id="viewer"><button class="viewerClose" id="viewerClose">×</button><div class="viewerCard"><img id="viewerImg" alt="사진 크게 보기"><div class="viewerNote" id="viewerNote"></div></div></div><script>
const pad=n=>String(n).padStart(2,"0"), localDate=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()), today=new Date(), todayKey=localDate(today);
const oldKey="12frames-"+todayKey, key=d=>"oneframe-"+d;
let selectedKey=todayKey, view=new Date(today.getFullYear(),today.getMonth(),1), data=JSON.parse(localStorage.getItem(key(selectedKey))||"{}");
if(!data.img){try{const old=JSON.parse(localStorage.getItem(oldKey)||"{}");const first=Object.values(old).find(x=>x&&x.img);if(first){data={img:first.img,note:first.note||""};localStorage.setItem(key(todayKey),JSON.stringify(data))}}catch(e){}}
const fmt=new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(today);document.querySelector("#date").textContent=fmt;
function save(){localStorage.setItem(key(selectedKey),JSON.stringify(data));renderToday();renderCalendar()}
function renderToday(){document.querySelector("#date").textContent=new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date(selectedKey+"T12:00:00"));document.querySelector(".prompt").textContent=selectedKey===todayKey?"오늘을 한 장만 남긴다면?":"이 날을 한 장만 남긴다면?";const p=document.querySelector("#photo");p.innerHTML=(data.img?'<img src="'+data.img+'" alt="오늘의 사진">':"＋")+'<input id="file" type="file" accept="image/*">';p.querySelector("#file").onchange=pick;document.querySelector("#note").value=data.note||""}
function pick(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>compress(r.result);r.readAsDataURL(f)}
function compress(src){const im=new Image();im.onload=()=>{const max=1200,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);data.img=c.toDataURL("image/jpeg",.78);save()};im.src=src}
document.querySelector("#note").oninput=e=>{data.note=e.target.value;localStorage.setItem(key(selectedKey),JSON.stringify(data));renderCalendar()};
document.querySelector("#remove").onclick=()=>{if(confirm("이 날의 사진과 문장을 지울까?")){localStorage.removeItem(key(selectedKey));data={};renderToday();renderCalendar()}};
function renderCalendar(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),cal=document.querySelector("#calendar");document.querySelector("#monthTitle").textContent=y+"년 "+(m+1)+"월";cal.innerHTML="";for(let i=0;i<first.getDay();i++){const x=document.createElement("div");x.className="day empty";cal.appendChild(x)}for(let d=1;d<=last.getDate();d++){const ds=y+"-"+pad(m+1)+"-"+pad(d),rec=JSON.parse(localStorage.getItem(key(ds))||"{}"),x=document.createElement("div");x.className="day"+(ds===todayKey?" todayMark":"");if(rec.img){x.onclick=()=>{document.querySelector("#viewerImg").src=rec.img;document.querySelector("#viewerNote").textContent=rec.note||"";document.querySelector("#viewer").classList.add("show")};x.innerHTML='<img src="'+rec.img+'" alt="'+ds+'"><span class="n">'+d+"</span>"}else x.innerHTML='<span class="n">'+d+"</span>";x.title=rec.note||ds;x.style.cursor="pointer";if(!rec.img)x.onclick=()=>{selectedKey=ds;data=JSON.parse(localStorage.getItem(key(selectedKey))||"{}");renderToday();renderCalendar();window.scrollTo({top:0,behavior:"smooth"})};if(ds===selectedKey)x.style.outline="2px solid #8b857b";cal.appendChild(x)}}
document.querySelector("#prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCalendar()};document.querySelector("#next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCalendar()};
document.querySelector("#viewerClose").onclick=()=>document.querySelector("#viewer").classList.remove("show");document.querySelector("#viewer").onclick=e=>{if(e.target.id==="viewer")e.currentTarget.classList.remove("show")};renderToday();renderCalendar();if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()))}
</script></body></html>
